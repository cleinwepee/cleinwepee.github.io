<!doctype html>
<html class="dark motion-safe:scroll-smooth" lang="en">
  <head>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/assets/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Clein Wepee" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourdomain.com/" />
    <meta name="theme-color" content="#f87171" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clein Wepee" />
    <meta property="og:title" content="Clein Wepee | Laravel Developer" />
    <meta
      property="og:description"
      content="I turn complex ideas into powerful Laravel applications, built to perform, built to scale, built to stand out."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clein Wepee, Laravel Developer" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clein Wepee | Laravel Developer" />
    <meta
      name="twitter:description"
      content="I turn complex ideas into powerful Laravel applications, built to perform, built to scale,
        built to stand out."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

    <!-- Structured data (helps Google understand who you are) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Clein Wepee",
        "jobTitle": "Laravel Developer",
        "url": "https://yourdomain.com/",
        "sameAs": ["https://github.com/your-username", "https://www.linkedin.com/in/your-username"]
      }
    </script>

    <title>Clein Wepee</title>
  </head>

  <body class="font-nunito">
    <div id="app"></div>

    <script>
      document.documentElement.classList.toggle(
        'dark',
        localStorage.theme === 'dark' ||
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme:dark)').matches),
      )
    </script>

    <script type="module" src="/src/main.ts"></script>
    <script src="https://kit.fontawesome.com/e2080f97af.js" crossorigin="anonymous"></script>
  </body>
</html>
